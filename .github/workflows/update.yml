# Hourly: fetch current station AQI (data/latest.json) and publish the site to GitHub Pages.
# Daily (the 02:xx UTC run) or on manual run with "full refresh": also rebuild the history from
# CPCB files + OpenAQ archive and commit the updated site/data/*.json.
# Needs repository secret OPENAQ_API_KEY, and Settings > Pages > Source = "GitHub Actions".
name: Update data and deploy

on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Also rebuild history (slower)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether to rebuild history
        id: mode
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ] || [ "$(date -u +%H)" = "02" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore OpenAQ archive cache
        if: steps.mode.outputs.full == 'true'
        uses: actions/cache@v4
        with:
          path: raw/openaq_cache
          key: openaq-${{ github.run_id }}
          restore-keys: openaq-

      - name: Rebuild history
        if: steps.mode.outputs.full == 'true'
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          python tools/download_cpcb.py raw
          python tools/fetch_openaq.py raw
          python tools/process.py raw site/data

      - name: Commit updated history
        if: steps.mode.outputs.full == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/meta.json site/data/daily.json site/data/summary.json site/data/insights.json site/data/pollutants.json
          git diff --cached --quiet || (git commit -m "Daily data refresh" && git push)

      - name: Fetch current station AQI
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python tools/fetch_latest.py site/data
        continue-on-error: true   # if OpenAQ is down, still deploy; the site shows the last-update time

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
